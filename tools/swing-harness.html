<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Swing harness</title>
<style>
  body { margin: 0; background: #111; color: #eee; font: 12px monospace; }
  #c { display: block; cursor: crosshair; }
  #log { padding: 6px; white-space: pre-wrap; }
</style>
</head>
<body>
<video id="v" playsinline muted style="display:none"></video>
<canvas id="c" width="900" height="700"></canvas>
<div id="log"></div>
<script>
/*MEASURE-START*/
// Pure geometry and gating for swing measurement. No DOM access in this block —
// it is extracted and run in Node by test-swing-measure.js via
// vm.runInThisContext. Declare with `var`/`function` only, matching the
// convention of this project's three other extracted-block harnesses (which
// use plain `eval` and require it): those do NOT expose `const`/`let` to the
// caller, so keeping this block consistent with them means it stays portable
// if it is ever extracted the same way elsewhere.

// Even with perfect static references, a hand-placed landmark is only good to a
// pixel or two. No measurement is ever treated as more precise than this.
var CLICK_PRECISION_PX = 2;

// Maps a point clicked on the displayed canvas back into the source video's own
// pixel coordinates. The harness renders a zoomed crop so landmarks can be
// placed precisely; this is the inverse of that transform.
function screenToVideo(pt, view) {
  if (!pt || !view || !view.zoom || view.cropX == null || view.cropY == null) return null;
  return { x: view.cropX + pt.x / view.zoom, y: view.cropY + pt.y / view.zoom };
}

// Returns b minus a, so a positive dx/dy means the point moved right/down.
function pointDelta(a, b) {
  if (!a || !b) return null;
  return { dx: b.x - a.x, dy: b.y - a.y };
}

// Camera drift between two frames, estimated from static background points
// paired by index: refsA[i] and refsB[i] are the same real-world point. Their
// disagreement is the noise floor for anything measured between these frames.
function cameraDrift(refsA, refsB) {
  if (!refsA || !refsB || !refsA.length || refsA.length !== refsB.length) return null;
  var shifts = [];
  for (var i = 0; i < refsA.length; i++) {
    var d = pointDelta(refsA[i], refsB[i]);
    if (!d) return null;
    shifts.push(d);
  }
  var mdx = 0, mdy = 0;
  shifts.forEach(function (s) { mdx += s.dx; mdy += s.dy; });
  mdx /= shifts.length; mdy /= shifts.length;
  var spread = 0;
  shifts.forEach(function (s) {
    var dev = Math.sqrt((s.dx - mdx) * (s.dx - mdx) + (s.dy - mdy) * (s.dy - mdy));
    if (dev > spread) spread = dev;
  });
  return { dx: mdx, dy: mdy, spread: spread };
}

// Landmark movement with camera drift removed, plus the gate deciding whether it
// means anything. `signal` is false when the corrected movement is not clearly
// larger than the frames' own noise floor, or when fewer than two static
// references were available to estimate drift at all — reported as no signal,
// never as a small finding.
function correctedDelta(landmarkA, landmarkB, refsA, refsB) {
  var raw = pointDelta(landmarkA, landmarkB);
  var drift = cameraDrift(refsA, refsB);
  if (!raw || !drift) return null;
  var dx = raw.dx - drift.dx;
  var dy = raw.dy - drift.dy;
  var magnitude = Math.sqrt(dx * dx + dy * dy);
  var noiseFloor = Math.max(drift.spread, CLICK_PRECISION_PX);
  return {
    dx: dx,
    dy: dy,
    // Screen y grows downward, so a landmark that rose has negative dy. This
    // field exists to stop that sign flip from becoming a wrong finding.
    riseUp: -dy,
    magnitude: magnitude,
    noiseFloor: noiseFloor,
    refCount: refsA.length,
    signal: refsA.length >= 2 && magnitude > noiseFloor
  };
}

// Backswing duration over downswing duration. Reports the measured ratio and
// nothing about whether it is good — this project carries no population
// baseline by design.
function tempoRatio(addressTime, topTime, impactTime) {
  if (addressTime == null || topTime == null || impactTime == null) return null;
  var back = topTime - addressTime;
  var down = impactTime - topTime;
  if (!(back > 0) || !(down > 0)) return null;
  return back / down;
}

// A finding is only improving when it shrank by more than the noise floor of the
// current measurement. A smaller number inside the noise is not progress.
function isImprovement(prevMagnitude, currMagnitude, noiseFloor) {
  if (prevMagnitude == null || currMagnitude == null || noiseFloor == null) return false;
  return currMagnitude < prevMagnitude - noiseFloor;
}

// Pixels to inches, only when a credible in-frame reference was actually
// measured. Returns null rather than inventing a scale.
function toInches(pixels, scaleRef) {
  if (pixels == null || !scaleRef || !scaleRef.pixels || scaleRef.inches == null) return null;
  return pixels * (scaleRef.inches / scaleRef.pixels);
}
/*MEASURE-END*/

var v = document.getElementById('v');
var c = document.getElementById('c');
var ctx = c.getContext('2d', { willReadFrequently: true });
var logEl = document.getElementById('log');
var view = { cropX: 0, cropY: 0, zoom: 1 };
// marks[i].x/y are stored in video-native pixel space (screenToVideo's output),
// not canvas/screen space -- render() below converts back for drawing.
var marks = [];
var pendingLabel = null;
var clipUrl = null;
var pendingSeekReject = null;
var pendingLoadReject = null;

function log(msg) { logEl.textContent = String(msg); }

// Single error handler for the <video> element, set once and never
// reassigned per-call (an earlier version set v.onerror separately inside
// load() and left it attached with no path back to a seek in flight — a
// decode error during a later scrub would only reach log(), leaving
// whichever seek() promise was pending to hang forever with no rejection).
// Rejects whichever operation is actually outstanding, load or seek.
function onVideoError() {
  var msg = 'decode failed: ' + (v.error && v.error.message);
  log(msg);
  if (pendingLoadReject) { pendingLoadReject(new Error(msg)); pendingLoadReject = null; }
  else if (pendingSeekReject) { pendingSeekReject(new Error(msg)); pendingSeekReject = null; }
}
v.onerror = onVideoError;

// Callers must await one seek before issuing the next. Assigning v.onseeked
// again before the previous seek fires overwrites the handler, which would
// otherwise orphan the earlier call's promise forever (the browser only fires
// one `seeked` event for the latest pending target). Guard against that by
// explicitly rejecting whichever seek is still outstanding when a new one
// starts, so a caller that violates the contract gets a catchable error
// instead of a silent hang.
//
// Deliberately always assigns currentTime and waits for `seeked`, even when
// the target already equals v.currentTime -- verified empirically that the
// browser still fires `seeked` on a same-value reassignment, and skipping it
// (an earlier version of this function did, as an optimization) let a freshly
// loaded, never-painted video hand back a solid-black frame at t=0 while
// still reporting readyState 4. Every caller depends on the returned frame
// actually being painted, so there is no safe case to skip this wait.
//
// Rejects immediately, rather than hanging, if called before a video has
// loaded far enough to seek at all (readyState HAVE_NOTHING) -- otherwise
// assigning currentTime here may never produce a `seeked` event.
function seek(t) {
  if (pendingSeekReject) { pendingSeekReject(new Error('seek superseded by a newer seek')); pendingSeekReject = null; }
  if (v.readyState < 1) return Promise.reject(new Error('seek() called before a video is loaded'));
  return new Promise(function (res, rej) {
    pendingSeekReject = rej;
    v.onseeked = function () {
      v.onseeked = null;
      pendingSeekReject = null;
      res(v.currentTime);
    };
    v.currentTime = t;
  });
}

function render() {
  var sw = c.width / view.zoom, sh = c.height / view.zoom;
  ctx.clearRect(0, 0, c.width, c.height);
  ctx.drawImage(v, view.cropX, view.cropY, sw, sh, 0, 0, c.width, c.height);
  marks.forEach(function (m) {
    var x = (m.x - view.cropX) * view.zoom, y = (m.y - view.cropY) * view.zoom;
    ctx.strokeStyle = '#0f0'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(x - 12, y); ctx.lineTo(x + 12, y);
    ctx.moveTo(x, y - 12); ctx.lineTo(x, y + 12); ctx.stroke();
    ctx.fillStyle = '#0f0'; ctx.font = '13px monospace';
    ctx.fillText(m.label || '', x + 14, y - 4);
  });
}

var SH = {
  load: function (url) {
    clipUrl = url;
    return new Promise(function (res, rej) {
      v.onloadedmetadata = function () {
        // Clear this on success: onVideoError checks pendingLoadReject first,
        // and a load that already resolved must not keep intercepting a
        // later, unrelated mid-seek decode error.
        pendingLoadReject = null;
        view = { cropX: 0, cropY: 0,
                 zoom: Math.min(c.width / v.videoWidth, c.height / v.videoHeight) };
        res({ duration: v.duration, width: v.videoWidth, height: v.videoHeight });
      };
      pendingLoadReject = rej;
      v.src = url;
    });
  },
  seek: function (t) { return seek(t).then(function (at) { render(); return at; }); },
  setView: function (cropX, cropY, zoom) {
    view = { cropX: cropX, cropY: cropY, zoom: zoom }; render(); return view;
  },
  getView: function () { return view; },
  time: function () { return v.currentTime; },

  // Frame-to-frame pixel difference at low resolution. Returns numbers, never
  // images, which is what makes scanning a long multi-swing clip affordable.
  // Samples the red channel only, as a fast luminance proxy rather than a
  // full R+G+B/luma average -- a 3x speed shortcut, not yet shown to matter
  // for detection quality one way or the other.
  scanMotion: async function (t0, t1, step) {
    var small = document.createElement('canvas');
    small.width = 96;
    small.height = Math.max(1, Math.round(96 * v.videoHeight / v.videoWidth));
    var sctx = small.getContext('2d', { willReadFrequently: true });
    var out = [], prev = null;
    for (var t = t0; t <= t1; t += step) {
      await seek(t);
      // dWidth/dHeight here are exactly small.width/height, so drawImage
      // always overwrites the entire canvas -- no clearRect needed, and no
      // rounding case can leave a stale pixel from the previous frame.
      sctx.drawImage(v, 0, 0, small.width, small.height);
      var cur = sctx.getImageData(0, 0, small.width, small.height).data;
      if (prev) {
        var sum = 0;
        for (var i = 0; i < cur.length; i += 4) sum += Math.abs(cur[i] - prev[i]);
        // Not rounded to an integer: this value feeds a peak-vs-median
        // comparison where the signal is often only a small multiple of the
        // noise floor, and integer rounding can quietly erase the exact
        // distinction that comparison depends on.
        out.push({ time: Math.round(t * 1000) / 1000,
                   energy: Math.round(sum / (cur.length / 4) * 100) / 100 });
      }
      prev = cur.slice();
    }
    return out;
  },

  // Impact from the audio transient: the strike is a sharp jump in short-window
  // RMS, which pins impact far more precisely than the motion peak, whose true
  // frame is smeared by blur and sampling. Returns null when the clip has no
  // decodable audio or no audibly sharp strike, so the caller falls back.
  findImpactAudio: async function (t0, t1) {
    var audio;
    // One AudioContext reused across attempts and explicitly closed once the
    // channel data is extracted below -- browsers cap the number of
    // concurrently open AudioContexts, and creating a fresh one per retry
    // attempt (an earlier version of this code did) risks exhausting that
    // cap over a long harness session that calls this repeatedly.
    var actx = new (window.AudioContext || window.webkitAudioContext)();
    // Retried a few times: a plain fetch of a large clip through this
    // browser-automation environment has been observed to intermittently
    // fail ("Failed to fetch" / connection reset) even after a real server
    // bug in the same path was fixed -- possibly the sandboxed
    // browser-to-localhost relay itself, not just the server. Without a
    // retry, that transient failure and a genuinely undecodable/silent clip
    // both fall into the same catch and return the same null, silently
    // conflating "no transient" with "the network hiccuped" -- exactly the
    // kind of noise-as-conclusion this project avoids everywhere else.
    //
    // Logged rather than silently returning null on final failure: 3 retries
    // narrows how often a flake is mistaken for "no transient" but cannot
    // fully eliminate the ambiguity, since a genuinely undecodable clip fails
    // identically on every attempt. The log line is what lets a person
    // reading the harness's output tell the two apart after the fact.
    for (var attempt = 0; attempt < 3 && !audio; attempt++) {
      try {
        var buf = await (await fetch(clipUrl)).arrayBuffer();
        audio = await actx.decodeAudioData(buf);
      } catch (e) {
        if (attempt === 2) {
          log('findImpactAudio: giving up after 3 attempts -- ' + e.message);
          actx.close();
          return null;
        }
      }
    }
    var data = audio.getChannelData(0), rate = audio.sampleRate;
    actx.close();
    var a = Math.max(0, Math.floor(t0 * rate));
    var b = Math.min(data.length, Math.ceil(t1 * rate));
    var win = Math.max(1, Math.round(rate * 0.005));
    var best = { time: null, jump: 0 }, prevE = null, sumJump = 0, nJump = 0;
    for (var i = a; i + win < b; i += win) {
      var e = 0;
      for (var j = i; j < i + win; j++) e += data[j] * data[j];
      e = Math.sqrt(e / win);
      if (prevE != null) {
        var jump = e - prevE;
        if (jump > 0) { sumJump += jump; nJump++; }
        if (jump > best.jump) best = { time: i / rate, jump: jump };
      }
      prevE = e;
    }
    // A transient only counts if it clearly stands out from ordinary variation;
    // otherwise the track is silent or merely noisy and motion should be used.
    var meanJump = nJump ? sumJump / nJump : 0;
    if (!best.time || !meanJump || best.jump < meanJump * 8) return null;
    return { time: best.time, jump: best.jump, prominence: best.jump / meanJump };
  },

  // Arms the next canvas click to record a landmark under this label. The click
  // handler converts to video-pixel space and draws a crosshair, so a misplaced
  // click is caught by looking at the next screenshot rather than becoming a
  // silent error in the measurement.
  mark: function (label) { pendingLabel = label; return 'armed: ' + label; },
  points: function () { return marks.slice(); },
  clearPoints: function () { marks = []; pendingLabel = null; render(); return 'cleared'; },

  // Draws the measurement between two named marks so the delta is visible in the
  // screenshot rather than asserted in prose. Note this line is not persisted:
  // any later seek/setView/click/clearPoints call re-renders from marks alone
  // and silently erases it. Screenshot immediately after calling this, before
  // doing anything else, or the annotation will already be gone.
  annotate: function (labelA, labelB, caption) {
    // Re-marking a label overwrites the prior mark under it (see the click
    // handler below), so at most one mark per label ever exists here -- this
    // lookup does not need "most recent wins" logic of its own.
    var A = marks.filter(function (m) { return m.label === labelA; })[0];
    var B = marks.filter(function (m) { return m.label === labelB; })[0];
    if (!A || !B) return 'missing mark';
    var ax = (A.x - view.cropX) * view.zoom, ay = (A.y - view.cropY) * view.zoom;
    var bx = (B.x - view.cropX) * view.zoom, by = (B.y - view.cropY) * view.zoom;
    ctx.strokeStyle = '#ff0'; ctx.lineWidth = 2; ctx.setLineDash([6, 4]);
    ctx.beginPath(); ctx.moveTo(ax, ay); ctx.lineTo(bx, by); ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle = '#ff0'; ctx.font = 'bold 15px monospace';
    ctx.fillText(caption || '', Math.min(ax, bx) + 8, Math.min(ay, by) - 8);
    return 'annotated';
  }
};

c.addEventListener('click', function (e) {
  // A click with no label armed is refused, not silently recorded -- every
  // other function in this file gates on ambiguity rather than guessing
  // (correctedDelta's signal, toInches' missing-scale null, etc.), and an
  // unlabeled click is exactly that: a mark nothing can safely reference.
  if (pendingLabel == null) { log('click ignored: no label armed -- call SH.mark(label) first'); return; }
  var r = c.getBoundingClientRect();
  var scr = { x: (e.clientX - r.left) * (c.width / r.width),
              y: (e.clientY - r.top) * (c.height / r.height) };
  var p = screenToVideo(scr, view);
  // Also refused if the click resolves outside the actual video frame -- the
  // canvas can show letterboxed empty space when its aspect ratio doesn't
  // match the loaded video's, and a click there is not a real position.
  if (!p || p.x < 0 || p.y < 0 || p.x > v.videoWidth || p.y > v.videoHeight) {
    log('click ignored: outside the video frame');
    return;
  }
  // Re-marking the same label overwrites its prior point rather than adding
  // a second one -- this is the intended way to correct a misclick (re-arm
  // the same label and click again). Without this, annotate() and any other
  // by-label lookup would keep resolving to whichever point was clicked
  // FIRST, silently ignoring the correction.
  marks = marks.filter(function (m) { return m.label !== pendingLabel; });
  marks.push({ x: p.x, y: p.y, label: pendingLabel, time: v.currentTime });
  log('marked ' + pendingLabel + ' at ' + p.x.toFixed(1) + ',' + p.y.toFixed(1));
  pendingLabel = null;
  render();
});
</script>
</body>
</html>
